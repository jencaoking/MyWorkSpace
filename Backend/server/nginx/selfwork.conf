# 自律工作台 后端 Nginx 站点配置示例（PHP 8.2-FPM）
# 将本文件软链到 /etc/nginx/sites-enabled/ 并 reload。

server {
    listen 80;
    server_name your-domain.example.com;   # 改为你的域名

    root /path/to/server;                   # 改为 server/ 目录绝对路径
    index index.php;

    # 强制 HTTPS（部署后配合 Let's Encrypt 使用）
    # return 301 https://$host$request_uri;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(ht|git) {
        deny all;
    }
}
