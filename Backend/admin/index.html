<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自律工作台 · 后台管理</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- 登录遮罩：未鉴权时显示 -->
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card glass" autocomplete="off">
      <div class="login-mark">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
          <path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6l-8-4Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="m8.5 12 2.4 2.5L15.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>后台管理</h1>
      <p class="login-sub">请输入管理员密码以继续</p>
      <input type="password" id="loginPwd" placeholder="管理员密码" required />
      <button type="submit" id="loginBtn" class="btn-primary">登录</button>
      <div id="loginErr" class="login-err" hidden></div>
    </form>
  </div>

  <!-- 主应用：登录后显示 -->
  <div id="app" class="app" hidden>
    <aside class="sidebar glass">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>自律工作台</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">SelfWork Admin</div>
    </aside>

    <div class="main">
      <header class="topbar glass">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-btn" aria-label="菜单">☰</button>
          <h2 id="viewTitle">概览</h2>
        </div>
        <div class="topbar-right">
          <span id="connStatus" class="status-dot" title="连接状态"></span>
          <span id="connText" class="conn-text">检测中…</span>
          <button id="refreshBtn" class="icon-btn" aria-label="刷新">⟳</button>
          <button id="logoutBtn" class="btn-ghost">退出</button>
        </div>
      </header>

      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="editModal" class="modal-overlay" hidden>
    <div class="modal glass">
      <div class="modal-head">
        <h3 id="editTitle">编辑行</h3>
        <button class="icon-btn" data-close="editModal" aria-label="关闭">✕</button>
      </div>
      <div id="editForm" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn-ghost" data-close="editModal">取消</button>
        <button id="saveEditBtn" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div id="delModal" class="modal-overlay" hidden>
    <div class="modal modal-sm glass">
      <div class="modal-head">
        <h3>删除确认</h3>
        <button class="icon-btn" data-close="delModal" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <p id="delText">确定要删除这条记录吗？该操作不可撤销。</p>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" data-close="delModal">取消</button>
        <button id="confirmDelBtn" class="btn-danger">删除</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
